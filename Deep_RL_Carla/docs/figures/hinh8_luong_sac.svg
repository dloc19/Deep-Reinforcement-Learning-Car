<svg viewBox="0 0 900 420" role="img" aria-label="Luồng cập nhật SAC: mỗi bước môi trường thêm một transition vào replay buffer rồi lấy mẫu một minibatch để cập nhật hai mạng Q, actor và hệ số nhiệt độ, cuối cùng cập nhật mượt mạng target" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f8-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f8-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A65BB8"/>
    </marker>
  </defs>

  <text x="0" y="16" font-size="11" fill="currentColor" fill-opacity=".55" letter-spacing=".06em">MỘT BƯỚC MÔI TRƯỜNG = MỘT BƯỚC GRADIENT (train_freq = 1)</text>
  <line x1="0" y1="24" x2="900" y2="24" stroke="currentColor" stroke-opacity=".25"/>

  <!-- env step -->
  <rect x="0" y="48" width="188" height="74" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="14" y="70" font-size="13" font-weight="600" fill="currentColor">Bước môi trường</text>
  <text x="14" y="90" font-size="11" fill="currentColor" fill-opacity=".72">a ~ tanh 𝒩(μ(o), σ(o))</text>
  <text x="14" y="108" font-size="11" fill="currentColor" fill-opacity=".72">khám phá từ chính actor đã warm-start</text>

  <!-- filter -->
  <rect x="0" y="142" width="188" height="66" rx="3" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="4 3"/>
  <text x="14" y="162" font-size="11" font-weight="600" fill="currentColor">Bộ lọc trước khi lưu</text>
  <text x="14" y="180" font-size="11" fill="currentColor" fill-opacity=".72">bỏ transition bị cắt vì hết giờ</text>
  <text x="14" y="196" font-size="11" fill="currentColor" fill-opacity=".72">→ done chỉ mang nghĩa THẤT BẠI THẬT</text>

  <!-- buffer -->
  <rect x="236" y="48" width="188" height="160" rx="3" fill="#A65BB8" fill-opacity=".1" stroke="#A65BB8"/>
  <text x="250" y="70" font-size="13" font-weight="600" fill="currentColor">Replay buffer</text>
  <text x="250" y="90" font-size="11" fill="currentColor" fill-opacity=".72">50 000 transition ≈ 2,2 GB</text>
  <g stroke="currentColor" stroke-opacity=".4" fill="currentColor" fill-opacity=".06">
    <rect x="250" y="104" width="26" height="22" rx="2"/>
    <rect x="280" y="104" width="26" height="22" rx="2"/>
    <rect x="310" y="104" width="26" height="22" rx="2"/>
    <rect x="340" y="104" width="26" height="22" rx="2"/>
    <rect x="370" y="104" width="26" height="22" rx="2"/>
  </g>
  <text x="250" y="146" font-size="11" fill="currentColor" fill-opacity=".72">mỗi quan sát lưu ĐÚNG một lần;</text>
  <text x="250" y="162" font-size="11" fill="currentColor" fill-opacity=".72">o′ suy ra từ ô kế tiếp lúc lấy mẫu</text>
  <text x="250" y="182" font-size="11" fill="#A65BB8">→ giảm một nửa RAM phần ảnh</text>
  <text x="250" y="198" font-size="10.5" fill="currentColor" fill-opacity=".6">bắt đầu học khi có ≥ 2000 mẫu</text>

  <!-- critic -->
  <rect x="472" y="48" width="428" height="96" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="486" y="70" font-size="13" font-weight="600" fill="currentColor">① Cập nhật hai mạng Q</text>
  <text x="486" y="90" font-size="11" fill="currentColor" fill-opacity=".72">Mục tiêu mềm: y = r + γ(1−done)·[ min(Q̄₁, Q̄₂) − α·log π(a′|o′) ]</text>
  <text x="486" y="108" font-size="11" fill="currentColor" fill-opacity=".72">Lấy min hai mạng độc lập → chống ước lượng vượt mức</text>
  <text x="486" y="128" font-size="11" fill="currentColor" fill-opacity=".72">Số hạng −α·log π chính là phần thưởng entropy nội sinh</text>

  <!-- actor -->
  <rect x="472" y="160" width="208" height="86" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="486" y="182" font-size="13" font-weight="600" fill="currentColor">② Cập nhật actor</text>
  <text x="486" y="202" font-size="11" fill="currentColor" fill-opacity=".72">gradient tái tham số hoá</text>
  <text x="486" y="218" font-size="11" fill="currentColor" fill-opacity=".72">qua a = tanh(u), u ~ 𝒩</text>
  <text x="486" y="236" font-size="11" fill="currentColor" fill-opacity=".72">cần hiệu chỉnh log-prob</text>

  <!-- alpha -->
  <rect x="692" y="160" width="208" height="86" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="706" y="182" font-size="13" font-weight="600" fill="currentColor">③ Điều chỉnh α</text>
  <text x="706" y="202" font-size="11" fill="currentColor" fill-opacity=".72">tự học để entropy tiến về</text>
  <text x="706" y="220" font-size="11" fill="currentColor" fill-opacity=".72">mục tiêu H̄ = −4,0</text>
  <text x="706" y="238" font-size="10.5" fill="currentColor" fill-opacity=".6">(mặc định −|A| = −2,0 quá cao cho chiều lái)</text>

  <!-- polyak -->
  <rect x="472" y="262" width="428" height="58" rx="3" fill="#A65BB8" fill-opacity=".1" stroke="#A65BB8"/>
  <text x="486" y="284" font-size="13" font-weight="600" fill="currentColor">④ Cập nhật mượt mạng target</text>
  <text x="486" y="304" font-size="11" fill="currentColor" fill-opacity=".72">θ̄ ← (1−τ)·θ̄ + τ·θ, τ = 0,005 — target trôi chậm để mục tiêu Bellman đứng yên đủ lâu</text>

  <!-- arrows -->
  <line x1="94" y1="122" x2="94" y2="138" stroke="currentColor" stroke-opacity=".5" marker-end="url(#f8-ar)"/>
  <line x1="188" y1="175" x2="228" y2="175" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f8-ar)"/>
  <line x1="424" y1="96" x2="464" y2="96" stroke="#A65BB8" marker-end="url(#f8-ap)"/>
  <text x="444" y="88" font-size="10.5" text-anchor="middle" fill="#A65BB8">128</text>
  <line x1="576" y1="144" x2="576" y2="156" stroke="currentColor" stroke-opacity=".5" marker-end="url(#f8-ar)"/>
  <path d="M 680 200 L 688 200" stroke="currentColor" stroke-opacity=".5" marker-end="url(#f8-ar)"/>
  <line x1="686" y1="246" x2="686" y2="258" stroke="currentColor" stroke-opacity=".5" marker-end="url(#f8-ar)"/>
  <path d="M 472 290 L 94 290 L 94 218" stroke="currentColor" stroke-opacity=".4" fill="none" stroke-dasharray="6 4" marker-end="url(#f8-ar)"/>
  <text x="280" y="284" font-size="11" fill="currentColor" fill-opacity=".65">chính sách mới sinh bước môi trường tiếp theo</text>

  <line x1="0" y1="352" x2="900" y2="352" stroke="currentColor" stroke-opacity=".2"/>
  <text x="0" y="372" font-size="11" fill="currentColor" fill-opacity=".72">Khác PPO ở chỗ then chốt: dữ liệu cũ vẫn dùng được vì mục tiêu Bellman không đòi hỏi mẫu phải sinh từ chính sách hiện tại.</text>
  <text x="0" y="390" font-size="11" fill="currentColor" fill-opacity=".72">Đổi lại phải giữ 2,2 GB bộ đệm, và điều kiện bắt đầu học phải tính theo SỐ MẪU ĐANG CÓ chứ không theo số bước toàn cục —</text>
  <text x="0" y="408" font-size="11" fill="currentColor" fill-opacity=".72">vì checkpoint không mang theo buffer, nên sau khi resume thì hai con số đó khác hẳn nhau.</text>
</svg>
