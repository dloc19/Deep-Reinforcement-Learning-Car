<svg viewBox="0 0 900 300" role="img" aria-label="Luồng xử lý quan sát: camera 480x384 nhãn thô, ánh xạ về 4 lớp, hạ mẫu bảo tồn lớp mỏng xuống 240x192, lưu 1 byte mỗi điểm ảnh, one-hot trên GPU" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f3-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FB522"/>
    </marker>
  </defs>

  <g font-size="11.5">
    <!-- 1 camera -->
    <rect x="0" y="56" width="150" height="78" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
    <text x="75" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Camera seg</text>
    <text x="75" y="100" text-anchor="middle" fill="currentColor" fill-opacity=".72">480 × 384</text>
    <text x="75" y="118" text-anchor="middle" fill="currentColor" fill-opacity=".72">nhãn thô 0–22</text>

    <!-- 2 LUT -->
    <rect x="196" y="56" width="150" height="78" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
    <text x="271" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Ánh xạ LUT</text>
    <text x="271" y="100" text-anchor="middle" fill="currentColor" fill-opacity=".72">→ 4 lớp huấn luyện</text>
    <text x="271" y="118" text-anchor="middle" fill="currentColor" fill-opacity=".72">480 × 384</text>

    <!-- 3 downsample -->
    <rect x="392" y="46" width="180" height="98" rx="3" fill="#7FB522" fill-opacity=".12" stroke="#7FB522"/>
    <text x="482" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Hạ mẫu bảo tồn</text>
    <text x="482" y="88" text-anchor="middle" fill="currentColor" fill-opacity=".72">nearest, rồi khôi phục</text>
    <text x="482" y="106" text-anchor="middle" fill="currentColor" fill-opacity=".72">lớp mỏng theo độ phủ</text>
    <text x="482" y="128" font-size="11" text-anchor="middle" fill="#7FB522">ngưỡng τ = 0,25</text>

    <!-- 4 buffer -->
    <rect x="618" y="56" width="130" height="78" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
    <text x="683" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Bộ đệm</text>
    <text x="683" y="100" text-anchor="middle" fill="currentColor" fill-opacity=".72">240 × 192</text>
    <text x="683" y="118" text-anchor="middle" fill="currentColor" fill-opacity=".72">uint8, 1 byte/px</text>

    <!-- 5 one-hot -->
    <rect x="794" y="56" width="106" height="78" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
    <text x="847" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">One-hot</text>
    <text x="847" y="100" text-anchor="middle" fill="currentColor" fill-opacity=".72">4×192×240</text>
    <text x="847" y="118" text-anchor="middle" fill="currentColor" fill-opacity=".72">trên GPU</text>
  </g>

  <line x1="150" y1="95" x2="188" y2="95" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f3-ar)"/>
  <line x1="346" y1="95" x2="384" y2="95" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f3-ar)"/>
  <line x1="572" y1="95" x2="610" y2="95" stroke="#7FB522" marker-end="url(#f3-ag)"/>
  <line x1="748" y1="95" x2="786" y2="95" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f3-ar)"/>

  <text x="0" y="26" font-size="11" fill="currentColor" fill-opacity=".55" letter-spacing=".06em">MỘT KHUNG HÌNH, TỪ CẢM BIẾN TỚI LỚP TÍCH CHẬP</text>
  <line x1="0" y1="34" x2="900" y2="34" stroke="currentColor" stroke-opacity=".2"/>

  <!-- chú thích ràng buộc -->
  <g font-size="11">
    <rect x="392" y="176" width="180" height="60" rx="3" fill="currentColor" fill-opacity=".04" stroke="#7FB522" stroke-opacity=".6" stroke-dasharray="4 3"/>
    <text x="482" y="196" text-anchor="middle" font-weight="600" fill="currentColor">Nếu dùng nearest thuần</text>
    <text x="482" y="214" text-anchor="middle" fill="currentColor" fill-opacity=".72">chỉ giữ 69% điểm ảnh</text>
    <text x="482" y="230" text-anchor="middle" fill="currentColor" fill-opacity=".72">lớp RoadLine (vạch kẻ)</text>
    <line x1="482" y1="144" x2="482" y2="172" stroke="#7FB522" stroke-opacity=".6" stroke-dasharray="3 3"/>

    <rect x="618" y="176" width="282" height="60" rx="3" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 3"/>
    <text x="632" y="196" font-weight="600" fill="currentColor">Vì sao lưu class-ID chứ không lưu one-hot</text>
    <text x="632" y="214" fill="currentColor" fill-opacity=".72">4× bộ nhớ nếu one-hot uint8; 16× nếu float32.</text>
    <text x="632" y="230" fill="currentColor" fill-opacity=".72">SAC 50k mẫu: 2,2 GB thay vì 8,8 GB.</text>
    <line x1="683" y1="134" x2="683" y2="172" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>

    <text x="0" y="196" font-weight="600" fill="currentColor">Ràng buộc khoá cứng</text>
    <text x="0" y="214" fill="currentColor" fill-opacity=".72">240×192 = đúng độ phân giải</text>
    <text x="0" y="230" fill="currentColor" fill-opacity=".72">IL đã huấn luyện. Sai số này</text>
    <text x="0" y="246" fill="currentColor" fill-opacity=".72">KHÔNG gây lỗi — chỉ làm</text>
    <text x="0" y="262" fill="currentColor" fill-opacity=".72">warm-start mất giá trị.</text>
  </g>
</svg>
