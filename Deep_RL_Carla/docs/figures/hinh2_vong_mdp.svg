<svg viewBox="0 0 900 380" role="img" aria-label="Vòng tương tác tác tử–môi trường: một quyết định giữ nguyên trong bốn tick vật lý; độ lệch làn chỉ đi vào phần thưởng, không đi vào quan sát" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f2-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FB522"/>
    </marker>
    <marker id="f2-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A65BB8"/>
    </marker>
  </defs>

  <!-- tác tử -->
  <rect x="20" y="120" width="200" height="96" rx="3" fill="#A65BB8" fill-opacity=".12" stroke="#A65BB8"/>
  <text x="120" y="148" font-size="13.5" font-weight="600" text-anchor="middle" fill="currentColor">Chính sách π_θ</text>
  <text x="120" y="170" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".72">CNN(mask) + MLP(vô hướng)</text>
  <text x="120" y="188" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".72">240 nghìn tham số</text>
  <text x="120" y="206" font-size="11" text-anchor="middle" fill="#A65BB8">chạy 1 lần / 0,2 s</text>

  <!-- action repeat -->
  <rect x="300" y="40" width="300" height="76" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="450" y="64" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Giữ nguyên lệnh trong k = 4 tick</text>
  <g stroke="currentColor" stroke-opacity=".5" fill="none">
    <rect x="322" y="78" width="58" height="22" rx="2"/>
    <rect x="390" y="78" width="58" height="22" rx="2"/>
    <rect x="458" y="78" width="58" height="22" rx="2"/>
    <rect x="526" y="78" width="58" height="22" rx="2"/>
  </g>
  <text x="351" y="93" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">0,05 s</text>
  <text x="419" y="93" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">0,05 s</text>
  <text x="487" y="93" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">0,05 s</text>
  <text x="555" y="93" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">0,05 s</text>

  <!-- môi trường -->
  <rect x="300" y="140" width="300" height="120" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="450" y="164" font-size="13.5" font-weight="600" text-anchor="middle" fill="currentColor">CARLA — chế độ đồng bộ</text>
  <text x="450" y="184" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".72">Vật lý UE4, Δt = 0,05 s cố định</text>
  <line x1="320" y1="196" x2="580" y2="196" stroke="currentColor" stroke-opacity=".2"/>
  <text x="450" y="214" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".72">camera segmentation · cảm biến va chạm</text>
  <text x="450" y="230" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".72">cảm biến vượt vạch · waypoint API</text>
  <text x="450" y="248" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".72">→ trạng thái thô s_t</text>

  <!-- bộ học -->
  <rect x="680" y="120" width="200" height="96" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="780" y="148" font-size="13.5" font-weight="600" text-anchor="middle" fill="currentColor">Bộ tối ưu hoá</text>
  <text x="780" y="170" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".72">PPO (rollout + GAE)</text>
  <text x="780" y="188" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity=".72">hoặc SAC (replay + twin-Q)</text>
  <text x="780" y="206" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".6">cập nhật θ</text>

  <!-- luồng hành động -->
  <path d="M 220 150 L 260 150 L 260 78 L 292 78" stroke="#A65BB8" fill="none" marker-end="url(#f2-ap)"/>
  <text x="228" y="142" font-size="11" fill="#A65BB8">a_t = [steer, longitudinal]</text>
  <line x1="450" y1="116" x2="450" y2="134" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f2-ar)"/>

  <!-- quan sát: chỉ ảnh + tốc độ + đèn -->
  <path d="M 300 178 L 240 178 L 240 196 L 226 196" stroke="#7FB522" fill="none" marker-end="url(#f2-ag)"/>
  <text x="150" y="248" font-size="11" font-weight="600" fill="#7FB522">Quan sát o_t</text>
  <text x="150" y="264" font-size="10.5" fill="currentColor" fill-opacity=".72">mask 4 lớp 240×192,</text>
  <text x="150" y="280" font-size="10.5" fill="currentColor" fill-opacity=".72">tốc độ, giới hạn tốc độ, đèn</text>

  <!-- phần thưởng -->
  <line x1="600" y1="178" x2="672" y2="178" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f2-ar)"/>
  <text x="636" y="170" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".75">r_t, done</text>
  <path d="M 780 216 L 780 300 L 120 300 L 120 220" stroke="currentColor" stroke-opacity=".5" fill="none" stroke-dasharray="5 4" marker-end="url(#f2-ar)"/>
  <text x="450" y="294" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".7">gradient cập nhật tham số θ của chính sách</text>

  <!-- tách bạch quan sát / thước đo -->
  <rect x="620" y="322" width="280" height="48" rx="3" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 3"/>
  <text x="634" y="342" font-size="11" fill="currentColor" fill-opacity=".75">lane_offset_m, heading_error_rad, yaw_rate</text>
  <text x="634" y="360" font-size="11" font-weight="600" fill="currentColor">chỉ vào phần thưởng — KHÔNG vào quan sát</text>
  <path d="M 618 346 L 470 346 L 470 264" stroke="currentColor" stroke-opacity=".4" fill="none" stroke-dasharray="4 3"/>
</svg>
