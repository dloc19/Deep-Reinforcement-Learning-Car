<svg viewBox="0 0 900 340" role="img" aria-label="Pipeline ba bước: hai bước đầu học ngoại tuyến trên tập dữ liệu tĩnh, bước ba học trong vòng kín với CARLA" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f1-ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A65BB8"/>
    </marker>
  </defs>

  <text x="0" y="14" font-size="11" fill="currentColor" fill-opacity=".55" letter-spacing=".08em">HỌC NGOẠI TUYẾN — TẬP DỮ LIỆU TĨNH, VÒNG HỞ</text>
  <text x="600" y="14" font-size="11" fill="#A65BB8" letter-spacing=".08em">HỌC TRONG VÒNG KÍN</text>
  <line x1="0" y1="24" x2="575" y2="24" stroke="currentColor" stroke-opacity=".25"/>
  <line x1="600" y1="24" x2="900" y2="24" stroke="#A65BB8" stroke-opacity=".5"/>

  <!-- bước 1 -->
  <rect x="0" y="48" width="250" height="92" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="14" y="72" font-size="11" fill="currentColor" fill-opacity=".55">Bước 1</text>
  <text x="14" y="92" font-size="14" font-weight="600" fill="currentColor">data_collection/</text>
  <text x="14" y="112" font-size="11.5" fill="currentColor" fill-opacity=".7">Passive client bám theo</text>
  <text x="14" y="128" font-size="11.5" fill="currentColor" fill-opacity=".7">automatic_control.py (chuyên gia)</text>

  <!-- bước 2 -->
  <rect x="300" y="48" width="250" height="92" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="314" y="72" font-size="11" fill="currentColor" fill-opacity=".55">Bước 2 — Kaggle GPU</text>
  <text x="314" y="92" font-size="14" font-weight="600" fill="currentColor">behavior_cloning/</text>
  <text x="314" y="112" font-size="11.5" fill="currentColor" fill-opacity=".7">2a. Segmentation (DeepLabV3+)</text>
  <text x="314" y="128" font-size="11.5" fill="currentColor" fill-opacity=".7">2b. Imitation Learning → π_IL</text>

  <!-- bước 3 -->
  <rect x="600" y="48" width="300" height="92" rx="3" fill="#A65BB8" fill-opacity=".12" stroke="#A65BB8"/>
  <text x="614" y="72" font-size="11" fill="#A65BB8">Bước 3 — local, cần CARLA server</text>
  <text x="614" y="92" font-size="14" font-weight="600" fill="currentColor">drl_training/</text>
  <text x="614" y="112" font-size="11.5" fill="currentColor" fill-opacity=".7">Warm-start actor ← π_IL, rồi</text>
  <text x="614" y="128" font-size="11.5" fill="currentColor" fill-opacity=".7">fine-tune PPO hoặc SAC → π_DRL</text>

  <!-- mũi tên giữa các bước -->
  <line x1="250" y1="94" x2="292" y2="94" stroke="currentColor" stroke-opacity=".6" marker-end="url(#f1-ar)"/>
  <text x="271" y="86" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity=".7">states.csv</text>
  <text x="271" y="112" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity=".7">+ mask</text>
  <line x1="550" y1="94" x2="592" y2="94" stroke="#A65BB8" marker-end="url(#f1-ar-a)"/>
  <text x="571" y="86" font-size="10.5" text-anchor="middle" fill="#A65BB8">best_il</text>
  <text x="571" y="112" font-size="10.5" text-anchor="middle" fill="#A65BB8">_model.pth</text>

  <!-- vòng kín bước 3 -->
  <rect x="640" y="212" width="220" height="52" rx="3" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".35"/>
  <text x="750" y="234" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">CARLA server (sync mode)</text>
  <text x="750" y="252" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".7">vật lý 20 Hz, quyết định 5 Hz</text>

  <path d="M 690 140 L 690 212" stroke="#A65BB8" fill="none" marker-end="url(#f1-ar-a)"/>
  <text x="682" y="180" font-size="10.5" text-anchor="end" fill="#A65BB8">hành động a_t</text>
  <path d="M 810 212 L 810 140" stroke="#A65BB8" fill="none" marker-end="url(#f1-ar-a)"/>
  <text x="818" y="172" font-size="10.5" fill="#A65BB8">quan sát o_t,</text>
  <text x="818" y="188" font-size="10.5" fill="#A65BB8">phần thưởng r_t</text>

  <!-- ghi chú tương phản -->
  <path d="M 125 140 L 125 224 L 300 224" stroke="currentColor" stroke-opacity=".35" fill="none" stroke-dasharray="4 4" marker-end="url(#f1-ar)"/>
  <text x="0" y="244" font-size="11" fill="currentColor" fill-opacity=".6">Dữ liệu cố định: chính sách học</text>
  <text x="0" y="260" font-size="11" fill="currentColor" fill-opacity=".6">KHÔNG ảnh hưởng tới dữ liệu nó thấy</text>
  <text x="0" y="276" font-size="11" fill="currentColor" fill-opacity=".6">→ lệch phân phối khi chạy vòng kín</text>

  <text x="600" y="300" font-size="11" fill="#A65BB8">Chính sách tự sinh ra dữ liệu huấn luyện của nó:</text>
  <text x="600" y="316" font-size="11" fill="#A65BB8">mọi trạng thái lệch làn đều được học cách thoát ra</text>
</svg>
