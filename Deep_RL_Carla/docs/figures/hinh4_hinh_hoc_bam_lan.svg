<svg viewBox="0 0 900 360" role="img" aria-label="Hình học bám làn nhìn từ trên xuống: độ lệch ngang có dấu và sai số hướng so với waypoint tâm làn; trong ngã tư waypoint tham chiếu nhảy sang nhánh vuông góc khiến phép đo mất ý nghĩa" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="f4-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A65BB8"/>
    </marker>
    <marker id="f4-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FB522"/>
    </marker>
    <marker id="f4-dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6">
      <circle cx="3" cy="3" r="2.5" fill="currentColor"/>
    </marker>
  </defs>

  <text x="0" y="16" font-size="11" fill="currentColor" fill-opacity=".55" letter-spacing=".06em">(a) TRÊN ĐƯỜNG THẲNG — PHÉP ĐO CÓ NGHĨA</text>
  <text x="500" y="16" font-size="11" fill="#A65BB8" letter-spacing=".06em">(b) TRONG NGÃ TƯ — THAM CHIẾU NHẢY</text>

  <!-- ================= panel a ================= -->
  <!-- mep lan -->
  <line x1="20" y1="80" x2="440" y2="80" stroke="currentColor" stroke-opacity=".55" stroke-width="2"/>
  <line x1="20" y1="240" x2="440" y2="240" stroke="currentColor" stroke-opacity=".55" stroke-width="2"/>
  <!-- tam lan -->
  <line x1="20" y1="160" x2="440" y2="160" stroke="#7FB522" stroke-dasharray="10 8" stroke-width="1.5"/>
  <text x="26" y="152" font-size="10.5" fill="#7FB522">tâm làn</text>

  <!-- chieu rong lan -->
  <line x1="60" y1="80" x2="60" y2="160" stroke="currentColor" stroke-opacity=".5" marker-start="url(#f4-ar)" marker-end="url(#f4-ar)"/>
  <text x="68" y="124" font-size="11.5" fill="currentColor">W / 2</text>
  <text x="68" y="140" font-size="10" fill="currentColor" fill-opacity=".6">nửa bề rộng làn</text>

  <!-- waypoint -->
  <circle cx="250" cy="160" r="4" fill="#7FB522"/>
  <text x="238" y="182" font-size="10.5" fill="#7FB522">waypoint w</text>
  <line x1="250" y1="160" x2="330" y2="160" stroke="#7FB522" stroke-width="1.6" marker-end="url(#f4-ag)"/>
  <text x="300" y="152" font-size="10.5" fill="#7FB522">t̂_w</text>

  <!-- xe -->
  <g transform="rotate(-20 250 116)">
    <rect x="222" y="102" width="56" height="28" rx="4" fill="#A65BB8" fill-opacity=".22" stroke="#A65BB8" stroke-width="1.6"/>
    <line x1="278" y1="116" x2="336" y2="116" stroke="#A65BB8" stroke-width="1.6" marker-end="url(#f4-ap)"/>
  </g>
  <circle cx="250" cy="116" r="3" fill="#A65BB8"/>
  <text x="196" y="100" font-size="10.5" fill="#A65BB8">xe (p, yaw)</text>
  <text x="322" y="72" font-size="10.5" fill="#A65BB8">t̂_v</text>

  <!-- do lech ngang d -->
  <line x1="250" y1="116" x2="250" y2="160" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#f4-ar)" marker-end="url(#f4-ar)"/>
  <text x="258" y="140" font-size="12" font-weight="600" fill="currentColor">d</text>
  <text x="268" y="140" font-size="10.5" fill="currentColor" fill-opacity=".65">= lane_offset_m</text>

  <!-- goc lech huong -->
  <path d="M 300 160 A 50 50 0 0 0 296 143" fill="none" stroke="currentColor" stroke-opacity=".7"/>
  <text x="306" y="140" font-size="12" font-weight="600" fill="currentColor">ψ</text>
  <text x="316" y="140" font-size="10.5" fill="currentColor" fill-opacity=".65">= heading_error_rad</text>

  <!-- dieu kien off lane -->
  <text x="20" y="278" font-size="11.5" fill="currentColor" fill-opacity=".8">Lệch làn khi |d| &gt; W/2 · Cả d và ψ đều lấy waypoint gần nhất làm gốc</text>
  <text x="20" y="296" font-size="11.5" fill="currentColor" fill-opacity=".8">→ hai đại lượng này chỉ vào phần thưởng, không vào quan sát (§3.3)</text>

  <!-- ================= panel b ================= -->
  <!-- lan ngang -->
  <line x1="500" y1="80" x2="900" y2="80" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 10"/>
  <line x1="500" y1="240" x2="900" y2="240" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 10"/>
  <!-- lan doc -->
  <line x1="680" y1="20" x2="680" y2="300" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 10"/>
  <line x1="800" y1="20" x2="800" y2="300" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 10"/>
  <rect x="680" y="80" width="120" height="160" fill="#A65BB8" fill-opacity=".07"/>
  <text x="740" y="296" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity=".6">vùng giao nhau (is_junction = 1)</text>

  <!-- xe di thang -->
  <rect x="694" y="146" width="56" height="28" rx="4" fill="#A65BB8" fill-opacity=".22" stroke="#A65BB8" stroke-width="1.6"/>
  <line x1="750" y1="160" x2="812" y2="160" stroke="#A65BB8" stroke-width="1.6" marker-end="url(#f4-ap)"/>
  <text x="818" y="164" font-size="10.5" fill="#A65BB8">hướng xe</text>

  <!-- waypoint nhay sang nhanh vuong goc -->
  <circle cx="740" cy="200" r="4" fill="#7FB522"/>
  <line x1="740" y1="200" x2="740" y2="266" stroke="#7FB522" stroke-width="1.6" marker-end="url(#f4-ag)"/>
  <text x="612" y="216" font-size="10.5" fill="#7FB522">waypoint gần nhất</text>
  <text x="612" y="230" font-size="10.5" fill="#7FB522">bám sang nhánh cắt</text>

  <path d="M 776 168 A 40 40 0 0 1 754 196" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width="1.4" marker-end="url(#f4-ar)"/>
  <text x="782" y="196" font-size="11.5" font-weight="600" fill="currentColor">ψ ≈ 175°</text>

  <text x="500" y="278" font-size="11.5" fill="#A65BB8">Đo trên runs/il_demo_v9: ψ nhảy 175° trong MỘT bước 0,2 s = 874°/s — bất khả thi</text>
  <text x="500" y="296" font-size="11.5" fill="#A65BB8">với xe thật. Vì vậy m_t = 1 sẽ tắt các số hạng phần thưởng theo làn (§7.3).</text>
</svg>
